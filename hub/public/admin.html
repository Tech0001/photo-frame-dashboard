<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hub</title>
<style>body{font:16px system-ui;margin:0;background:#f4f1e9;color:#262923}main{max-width:1000px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 20px}nav button{background:#e5e8de;color:#263a2c}nav button[aria-pressed="true"]{background:#263a2c;color:white}.record{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid #eee}.record label{margin:0;flex:1;min-width:110px}.record input,.record select{box-sizing:border-box;width:100%}.record button{margin:0;background:#6c4743}header{display:flex;align-items:center;justify-content:space-between}section{background:white;padding:24px;border-radius:18px;margin:18px 0}h1,h2{margin:0 0 12px}textarea{box-sizing:border-box;width:100%;min-height:150px;font:14px monospace;border:1px solid #bbb;border-radius:8px;padding:12px}button,a{font:inherit}button{padding:12px 20px;border:0;border-radius:8px;background:#263a2c;color:white;cursor:pointer;margin-top:12px}label{display:block;margin:14px 0}input,select{font:inherit;padding:9px;border:1px solid #bbb;border-radius:8px}p{line-height:1.5;color:#555}#notice{position:sticky;top:0;background:#f4f1e9;padding:12px;min-height:20px}a{color:#263a2c}.fields{display:flex;flex-wrap:wrap;gap:18px}details{margin:12px 0}summary{cursor:pointer;font-weight:600}code{overflow-wrap:anywhere}#subnav{border-bottom:1px solid #d8d9d1;padding-bottom:12px}#subnav button{padding:9px 14px;background:transparent;color:#555;margin:0}#subnav button[aria-pressed="true"]{background:white;color:#263a2c;box-shadow:0 1px 4px #0001}section[hidden]{display:none}section{margin-top:0}.connection-group{border:1px solid #e5e8de;border-radius:10px;padding:14px;margin:12px 0}.connection-group[open] summary{margin-bottom:16px}.connection-group label{max-width:640px}.connection-group input:not([type="checkbox"]),.connection-group select{box-sizing:border-box;width:100%}@media(max-width:600px){main{padding:16px}section{padding:16px}header{gap:16px}nav{gap:4px}nav button{padding:10px 12px}#notice:empty{display:none}}</style>
<main><header><h1>Hub</h1><a href="/">Open dashboard</a></header><nav aria-label="Hub settings"><button data-category="household" aria-pressed="true">Household</button><button data-category="shopping">Shopping</button><button data-category="connections">Connections</button><button data-category="display">Display</button><button data-category="backups">Backups</button></nav><nav id="subnav" aria-label="Settings pages"></nav><div id="notice" role="status"></div><div id="sections"></div></main>
<script>
'use strict';
const $=selector=>document.querySelector(selector), note=text=>$('#notice').textContent=text;
const escape=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){const r=await fetch(location.origin+path,{method,headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data;}
const schemas={people:[['name','Name'],['color','Colour','color'],['kid','Child','checkbox']],chores:[['name','Chore'],['who','Assigned to','person'],['r','When','routine']],events:[['title','Event'],['date','Date','date'],['start','Start','time'],['end','End','time'],['allDay','All day','checkbox'],['repeat','Repeat','repeat']],groceries:[['name','Item'],['cat','Category','category'],['store','Store','store'],['qty','Quantity','number'],['done','Bought','checkbox']],categories:[['name','Category']],stores:[['name','Name']],calendars:[['name','Calendar name'],['url','Private iCal URL','url']],commonItems:[['name','Item'],['cat','Category','category'],['usual','Usual','checkbox']]};
let category='household', page='people', integrationForms={};
const pages={household:[['people','People'],['chores','Chores'],['events','Schedule'],['calendars','Calendar feeds']],shopping:[['groceries','Shopping list'],['commonItems','Usual items'],['stores','Stores'],['categories','Categories']],connections:[['weather','Weather'],['homeassistant','Home Assistant'],['homelab','Homelab'],['accounts','Agents']],display:[['display','Screensaver'],['photos','Photos'],['refresh','Refresh rates']],backups:[['backups','Backups']]};
const titles={accounts:'Agents',homeassistant:'Home Assistant',homelab:'Homelab'};
function groupFor(key,path){if(key==='accounts')return ({codex:'Codex',claude:'Claude',openrouter:'OpenRouter'})[path.split('.')[0]]||'Sync';if(key==='homelab')return path.startsWith('pihole')?'Pi-hole':path.startsWith('gitea')?'Gitea':path.startsWith('github')?'GitHub':path.startsWith('rustdesk')?'RustDesk':path.startsWith('backup')?'Time Machine':'Plane';return 'Connection';}

function normalRow(key,record){if(key==='categories')record={name:typeof record==='string'?record:record.name||''};return '<div class="record" data-row data-record="'+escape(JSON.stringify(record))+'">'+schemas[key].map(([field,label,type])=>{let v=(field==='name'&&key==='chores'?record.title:record[field])??(field==='color'?'#1F6FEB':field==='qty'?1:field==='r'?'anytime':field==='who'?'any':'');if(type==='color')v=({blue:'#1F6FEB',pink:'#E91E8C',green:'#009B72',amber:'#FFB000',black:'#111111'})[v] || v;let input;
const choices=type==='person'?[['any','Anyone'],...data.people.map(p=>[p.id,p.name])]:type==='routine'?[['anytime','Anytime'],['morning','Morning'],['after','Midday'],['evening','Evening'],['bedtime','Bedtime']]:type==='category'?data.categories.map(c=>[c,c]):type==='store'?data.stores.map(st=>[st.id,st.name]):type==='repeat'?[['none','Once'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']]:null;
if(choices)input='<select data-field="'+field+'">'+choices.map(o=>'<option value="'+escape(o[0])+'"'+(v===o[0]?' selected':'')+'>'+escape(o[1])+'</option>').join('')+'</select>';
else input='<input data-field="'+field+'" type="'+(type==='checkbox'?'checkbox':type||'text')+'"'+(type==='checkbox'?(v?' checked':''):' value="'+escape(v)+'"')+'>';
return '<label>'+label+'<br>'+input+'</label>';}).join('')+'<button type="button" data-delete-row aria-label="Remove item">Remove</button></div>';}
function normalValue(key){const root=document.querySelector('[data-form="'+key+'"]');return Array.from(root.querySelectorAll('[data-row]')).map(row=>{const value=JSON.parse(row.dataset.record);row.querySelectorAll('[data-field]').forEach(input=>value[input.dataset.field]=input.type==='checkbox'?input.checked:input.type==='number'?Number(input.value):input.value);if(key==='chores')value.title=value.name;return key==='categories'?value.name:value;});}
function integrationEditor(key,value,schema){
const groups=new Map();schema.fields.forEach(field=>{const name=groupFor(key,field.path);if(!groups.has(name))groups.set(name,[]);groups.get(name).push(field);});
const inputs=Array.from(groups,([name,fields])=>'<details class="connection-group"'+(groups.size===1?' open':'')+'><summary>'+escape(name)+'</summary>'+fields.map(field=>{let current=value;for(const part of field.path.split('.'))current=current?.[part];if(field.secret)current='';let control;
if(field.type==='select')control='<select data-integration-field="'+field.path+'">'+field.options.map(o=>'<option value="'+escape(o[0])+'"'+(current===o[0]?' selected':'')+'>'+escape(o[1])+'</option>').join('')+'</select>';
else if(field.type==='textarea')control='<textarea data-integration-field="'+field.path+'"'+(field.secret?' data-secret':'')+'>'+escape(current??'')+'</textarea>';
else control='<input data-integration-field="'+field.path+'"'+(field.secret?' data-secret':'')+' type="'+(field.type||'text')+'"'+(field.type==='checkbox'?(current?' checked':''):' value="'+escape(current??'')+'"')+'>';
return '<label>'+escape(field.label)+'<br>'+control+'</label>';}).join('')+'</details>').join('');
return '<div data-integration="'+key+'">'+inputs+'</div><button data-integration-save="'+key+'">Save connection</button>'+schema.actions.map(action=>' <button data-integration-action="'+key+'" data-action-kind="'+action.kind+'">'+escape(action.label)+'</button>').join('')+'<div data-integration-result="'+key+'"></div>';
}
function editor(title,key,value,help=''){const normal=schemas[key]&&Array.isArray(value);return '<section data-section="'+key+'"><h2>'+title+'</h2><p>'+help+'</p>'+(integrationForms[key]?.fields.length?integrationEditor(key,value,integrationForms[key]):'')+(normal?'<div data-form="'+key+'">'+value.map(r=>normalRow(key,r)).join('')+'</div><button data-add-row="'+key+'">Add item</button> <button data-save="'+key+'">Save '+title.toLowerCase()+'</button>':'')+'<details><summary>Advanced: edit JSON</summary><label>JSON<textarea data-edit="'+key+'">'+escape(JSON.stringify(value,null,2))+'</textarea></label><button data-save-json="'+key+'">Save JSON</button></details></section>';}
function filterSections(){
const available=(category==='connections'?[...pages.connections,...Array.from(document.querySelectorAll('[data-section]')).map(s=>[s.dataset.section,s.querySelector('h2')?.textContent]).filter(([key])=>!Object.values(pages).flat().some(([known])=>known===key))]:pages[category]).filter(([key])=>document.querySelector('[data-section="'+key+'"]'));
if(!available.some(([key])=>key===page))page=available[0]?.[0];
document.querySelectorAll('[data-section]').forEach(section=>section.hidden=section.dataset.section!==page);
document.querySelectorAll('[data-category]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.category===category)));
$('#subnav').innerHTML=available.length>1?available.map(([key,label])=>'<button data-page="'+key+'" aria-pressed="'+(page===key)+'">'+escape(label)+'</button>').join(''):'';
}
let data;
async function load(){data=await api('/api/admin/data');const connections=await api('/api/admin/connections');integrationForms=connections._integrationForms||{};
let html='<section data-section="display"><h2>Screensaver</h2><div class="fields">'+data.tuneSchema.filter(r=>['theme','ambientStyle','homeSec','ambientSec'].includes(r.key)).map(r=>'<label>'+escape(r.label)+'<br>'+(r.type==='select'?'<select data-tune="'+r.key+'">'+r.options.map(o=>'<option value="'+escape(o[0])+'"'+(data.tune[r.key]===o[0]?' selected':'')+'>'+escape(o[1])+'</option>').join('')+'</select>':'<input data-tune="'+r.key+'" type="number" min="'+r.min+'" max="'+r.max+'" value="'+data.tune[r.key]+'">')+'</label>').join('')+'</div><button data-tune-save>Save settings</button></section>';
html+='<section data-section="refresh"><h2>Refresh rates</h2><p>Control how often the dashboard checks for updates and how long weather and calendar results are cached.</p><div class="fields">'+data.tuneSchema.filter(r=>!['theme','ambientStyle','homeSec','ambientSec'].includes(r.key)).map(r=>'<label>'+escape(r.label)+'<br><input data-tune="'+r.key+'" type="number" min="'+r.min+'" max="'+r.max+'" value="'+data.tune[r.key]+'"></label>').join('')+'</div><button data-tune-save>Save refresh rates</button></section>';
html+=editor('People','people',data.people,'Choose who uses the dashboard and give each person a colour.');
html+=editor('Chores','chores',data.chores,'Assign chores to a person or Anyone. Anytime chores appear throughout the day; completion resets each day.');
html+=editor('Schedule','events',data.events,'Add events and repeating reminders. All-day events need no start time.');
html+=editor('Groceries','groceries',data.groceries,'Manage your shopping list by store and category.');
html+=editor('Stores','stores',data.stores)+editor('Categories','categories',data.categories)+editor('Usual items','commonItems',data.commonItems,'Keep common purchases here and mark your usual items for quick access.');
html+='<section data-section="weather"><h2>Weather</h2><p>Choose the location and temperature units used by your displays.</p><label>Weather latitude <input id="lat" type="number" step="any" value="'+(connections.weather?.lat??'')+'"></label><label>Weather longitude <input id="lon" type="number" step="any" value="'+(connections.weather?.lon??'')+'"></label><label>Units <select id="units"><option value="c">Celsius</option><option value="f"'+(connections.weather?.units==='f'?' selected':'')+'>Fahrenheit</option></select></label><button data-connections-save>Save weather</button><p>Timezone: '+escape(connections.timezone)+'. Change config.json and restart to change it.</p></section>';
html+=editor('Calendar feeds','calendars',connections.calendars,'Add name, people and a private url to connect a feed. Existing feeds use secret and configured without exposing the URL.');
html+='<section data-section="photos"><h2>Photos</h2><label>Photo directory <input id="photo-dir" value="'+escape(connections.photosDir)+'"></label><button data-photo-directory-save>Save directory</button><label>Add image <input id="photo-file" type="file" accept="image/*"></label><button data-upload>Upload photo</button></section>';
for(const [key,value] of Object.entries(connections))if(value&&typeof value==='object'&&!['weather','calendars','_integrationForms'].includes(key))html+=editor(titles[key]||key[0].toUpperCase()+key.slice(1),key,value,'Open a service to change its connection. Empty password and token fields keep the saved credentials.');
html+='<section data-section="backups"><h2>Backups</h2><p>The last 20 state changes are saved locally. Config and secrets remain in their separate files.</p><button data-backups>List backups</button><div id="backups"></div></section>';
$('#sections').innerHTML=html;filterSections();
}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.category){category=b.dataset.category;filterSections();return;}if(b.dataset.page){page=b.dataset.page;filterSections();return;}if(b.hasAttribute('data-delete-row')){b.closest('[data-row]').remove();return;}if(b.dataset.addRow){const key=b.dataset.addRow;document.querySelector('[data-form="'+key+'"]').insertAdjacentHTML('beforeend',normalRow(key,{id:crypto.randomUUID()}));return;} b.disabled=true;note('Saving…');try{
if(b.dataset.save||b.dataset.saveJson){const key=b.dataset.save||b.dataset.saveJson,value=b.dataset.save?normalValue(key):JSON.parse(document.querySelector('[data-edit="'+key+'"]').value);if(key==='groceries')await api('/api/groceries','PUT',{items:value,base:data.groceries.map(g=>g.id)});else if(key==='calendars'||!['people','chores','events','stores','categories','commonItems'].includes(key))await api('/api/admin/connections','PUT',{[key]:value});else await api('/api/admin/'+key,'PUT',{[key]:value});await load();}
if(b.dataset.integrationSave){const key=b.dataset.integrationSave,value={};document.querySelector('[data-integration="'+key+'"]').querySelectorAll('[data-integration-field]').forEach(input=>{let v=input.type==='checkbox'?input.checked:input.type==='number'?Number(input.value):input.value;if(input.hasAttribute('data-secret')&&!v)return;if(input.dataset.integrationField==='entities')v=v.split(',').map(s=>s.trim()).filter(Boolean);const parts=input.dataset.integrationField.split('.');let target=value;parts.slice(0,-1).forEach(part=>{target[part] ||= {};target=target[part];});target[parts.at(-1)]=v;});await api('/api/admin/connections','PUT',{[key]:value});await load();}
if(b.dataset.integrationAction){if(!confirm('Generate a new sync token? This replaces any previous token; existing publishers will need the new one.')){note('Canceled.');return;}const result=await api('/api/admin/accounts/token','POST',{kind:b.dataset.actionKind});const root=document.querySelector('[data-integration-result="'+b.dataset.integrationAction+'"]');root.textContent='Shown only now. Save this in your publisher’s protected token file: '+result.token;}
if(b.hasAttribute('data-tune-save')){const values={};b.closest('section').querySelectorAll('[data-tune]').forEach(el=>values[el.dataset.tune]=el.tagName==='SELECT'?el.value:Number(el.value));await api('/api/admin/tune','PUT',{values});}
if(b.hasAttribute('data-connections-save')){const lat=$('#lat').value,lon=$('#lon').value;if((lat==='')!==(lon===''))throw Error('Enter both latitude and longitude');await api('/api/admin/connections','PUT',{weather:lat===''?null:{lat:Number(lat),lon:Number(lon),units:$('#units').value}});}
if(b.hasAttribute('data-photo-directory-save'))await api('/api/admin/connections','PUT',{photosDir:$('#photo-dir').value});
if(b.hasAttribute('data-upload')){const file=$('#photo-file').files[0];if(!file)throw Error('Choose an image first');const response=await fetch(location.origin+'/api/admin/photo-upload?name='+encodeURIComponent(file.name),{method:'POST',body:file});const answer=await response.json();if(!response.ok)throw Error(answer.error);}
if(b.hasAttribute('data-backups')){const backups=await api('/api/admin/backups');$('#backups').innerHTML=backups.state.map(name=>'<p><code>'+escape(name)+'</code> <button data-restore="'+escape(name)+'">Restore</button></p>').join('')||'<p>No backups yet.</p>';}
if(b.dataset.restore&&confirm('Restore this state backup? The current state will be backed up first.')){await api('/api/admin/restore','POST',{name:b.dataset.restore});await load();}
note('Done.');}catch(error){note(error.message);}finally{b.disabled=false;}});
load().catch(error=>note(error.message));
</script></html>
