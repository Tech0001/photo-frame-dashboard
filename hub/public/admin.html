<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap">
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#151515; --mute:#6b675e; --line:#ddd7ca; --acc:#151515; --ok:#0a7a4b; --bad:#c1272d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1f1f1f; --ink:#f1efe9; --mute:#9d998f; --line:#333; --acc:#f1efe9; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 "Geist",system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; }
  h1 { font-size:20px; margin:0; font-weight:650; letter-spacing:-.02em; }
  .shell { max-width:1180px; margin:0 auto; display:grid; grid-template-columns:230px minmax(0,1fr); align-items:start; }
  nav#tabs { position:sticky; top:49px; max-height:calc(100vh - 49px); overflow:auto; padding:12px 8px 12px 16px; display:flex; flex-direction:column; gap:2px; }
  nav h6 { margin:14px 8px 4px; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--mute); font-weight:600; } nav h6:first-child { margin-top:2px; }
  nav button { border:1px solid transparent; background:none; color:var(--ink); font:500 15px "Geist",system-ui; padding:8px 10px; border-radius:9px; cursor:pointer; text-align:left; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  nav button:hover { background:var(--card); } nav button.on { background:var(--card); border-color:var(--line); font-weight:650; }
  nav .tr { display:inline-flex; gap:4px; align-items:center; } nav .tn { color:var(--mute); font-size:12px; font-weight:500; } nav .tn.wait { color:#c98a00; font-weight:650; }
  @media (max-width:760px) { .shell { grid-template-columns:minmax(0,1fr); } nav#tabs { position:static; max-height:none; flex-direction:row; overflow-x:auto; padding:8px 16px; gap:4px; } nav h6 { display:none; } nav button { white-space:nowrap; } }
  main { min-width:0; padding:16px; }
  /* Standard: fixed grids, one line per cell, anything too long is cut with an ellipsis and the full text shows on hover (title is set by the mouseover handler). */
  .tt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  select, input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]) { text-overflow:ellipsis; }
  .fg { display:grid; grid-template-columns:minmax(90px,150px) minmax(0,1fr); gap:6px 12px; align-items:center; margin-bottom:8px; }
  .fg > label { color:var(--mute); font-size:14px; } .fg > label, .fg-h { min-width:0; }
  .fg > select, .fg > input:not([type=checkbox]) { width:100%; max-width:380px; flex:none; } .fg-h { grid-column:2; color:var(--mute); font-size:13px; margin-top:-2px; }
  .fg > .fg-w { display:flex; gap:8px; align-items:center; flex-wrap:wrap; min-width:0; }
  .row select { width:240px; max-width:100%; }
  .tune-g { display:grid; grid-template-columns:minmax(150px,240px) minmax(0,1fr) 170px; gap:6px 12px; align-items:center; }
  .tune-c { display:flex; gap:8px; align-items:center; min-width:0; } .tune-c select { width:100%; max-width:260px; } .tune-c input[type=range] { flex:1; min-width:80px; } .tune-ln { display:flex; gap:6px; align-items:center; min-width:0; } .tune-ln .tag { flex:none; margin-left:0; }
  .tune-g .btn.ghost { width:100%; padding:8px 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  @media (max-width:700px) { .fg { grid-template-columns:minmax(0,1fr); } .fg-h { grid-column:1; } .tune-g { grid-template-columns:minmax(0,1fr); } }
  .tune.mod .tune-l::after { content:' ●'; color:var(--acc); font-size:10px; vertical-align:2px; } .tune button:disabled { opacity:.35; cursor:default; }
  details.adv > summary { cursor:pointer; list-style:none; } details.adv > summary::-webkit-details-marker { display:none; } details.adv > summary::before { content:'▸ '; } details.adv[open] > summary::before { content:'▾ '; }
  .tune { margin:12px 0; } .tune-l { font-size:14px; }
  section { display:none; } section.on { display:block; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .row > * { flex:0 0 auto; }
  input, select, textarea { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; }
  input[type=text], input:not([type]) { flex:1 1 140px; }
  input[type=number] { width:64px; }
  input[type=color] { padding:2px; width:44px; height:38px; }
  button.btn { font:600 15px system-ui; border:0; border-radius:10px; padding:10px 16px; background:var(--acc); color:var(--bg); cursor:pointer; }
  button.ghost { background:none; color:var(--ink); border:1px solid var(--line); }
  button.x { background:none; border:0; color:var(--bad); font-size:20px; cursor:pointer; padding:4px 8px; }
  .days label { display:inline-flex; align-items:center; gap:2px; font-size:13px; color:var(--mute); margin-right:6px; }
  .mute { color:var(--mute); font-size:14px; } .ok { color:var(--ok); } .bad { color:var(--bad); }
  h2 { font-size:15px; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; vertical-align:-1px; margin-right:6px; }
  .bar { position:sticky; bottom:0; z-index:4; background:var(--bg); padding:12px 0; display:flex; gap:10px; align-items:center; }
  #msg { font-size:14px; }
  .subtabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .subtabs button { border:1px solid var(--line); background:var(--card); color:var(--mute); font:600 14px system-ui; padding:8px 14px; border-radius:999px; cursor:pointer; }
  .subtabs button.on { background:var(--acc); color:var(--bg); border-color:var(--acc); }
  .card.warn { border-color:#c98a00; background:transparent; }
  .secret-box { -webkit-text-security:disc; font-family:monospace; }
  .ph-row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); }
  .ph-row:last-child { border-bottom:0; }
  #dropzone { border:2px dashed var(--line); border-radius:12px; padding:22px 14px; text-align:center; margin:10px 0; }
  #dropzone.over { border-color:var(--acc); background:rgba(127,127,127,.12); }
  .up-q { margin:8px 0; font-size:14px; } .up-q > div { display:flex; justify-content:space-between; gap:12px; padding:4px 0; border-bottom:1px solid var(--line); }
  .up-q span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .up-grp { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:10px; }
  .up-grp.over, #dropzone.over { border-color:var(--acc); background:rgba(127,127,127,.12); }
  .up-gh { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .up-grid figure { cursor:grab; } .up-grid figure.sel img { outline:3px solid var(--acc); outline-offset:-3px; }
  .up-bar { padding:8px 0; }
  .up-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; margin-top:10px; }
  .up-grid figure { margin:0; position:relative; }
  .up-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; display:block; background:var(--bg); }
  .up-grid button.x { position:absolute; top:2px; right:2px; background:rgba(0,0,0,.6); color:#fff; border-radius:50%; width:28px; height:28px; padding:0; font-size:16px; line-height:1; }
  .emoji-btn { font-size:24px; line-height:1; padding:6px 12px; min-width:56px; }
  #picker { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; }
  #picker[hidden] { display:none; }
  .pk { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; width:100%; max-width:560px; max-height:88vh; overflow:auto; }
  .pk-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .pk-groups { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .pk-groups button { border:1px solid var(--line); background:none; color:var(--mute); font:600 13px system-ui; padding:6px 11px; border-radius:999px; cursor:pointer; }
  .pk-groups button.on { background:var(--acc); color:var(--bg); border-color:var(--acc); }
  .pk-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:6px; }
  .pk-grid button { font-size:28px; line-height:1; padding:8px 0; border:1px solid var(--line); border-radius:10px; background:var(--bg); cursor:pointer; }
  .pk-grid button.on { outline:3px solid var(--acc); }
  .sw-main { width:32px; height:32px; }
  .color-pop { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 2px 2px; margin-top:8px; border-top:1px solid var(--line); }
  .sw { width:28px; height:28px; border-radius:50%; border:2px solid var(--line); padding:0; cursor:pointer; display:inline-block; }
  .sw.on { outline:3px solid var(--ink); outline-offset:2px; }
  .sw-custom { background:conic-gradient(#e5252a,#ffb000,#00a36c,#2d5bff,#8957e5,#e4007c,#e5252a); position:relative; overflow:hidden; }
  .sw-custom input { opacity:0; position:absolute; inset:0; width:100%; height:100%; cursor:pointer; border:0; padding:0; }
  input[type=password], input[type=url] { flex:1 1 220px; }
  .sg { display:grid; grid-template-columns:52px repeat(24, minmax(0,1fr)); gap:2px; align-items:center; touch-action:none; user-select:none; margin:8px 0; }
  .sg-label { font-size:12px; color:var(--mute); white-space:nowrap; }
  .sg-hour { grid-column:span 3; font-size:11px; color:var(--mute); }
  .sg-cell { height:26px; padding:0; border:0; border-radius:3px; cursor:pointer; }
  .sg-n { background:#f2c14e; } .sg-d { background:#a07a1c; } .sg-o { background:#2a2a2a; box-shadow:inset 0 0 0 1px var(--line); }
  .sg-mix { background:repeating-linear-gradient(45deg,#8a8a8a 0 3px,#cfcfcf 3px 6px); }
  .sg-brush { border:1px solid var(--line); background:none; color:var(--ink); font:600 14px system-ui; padding:8px 12px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .sg-brush.on { outline:3px solid var(--acc); outline-offset:1px; }
  .sg-sw { display:inline-block; width:14px; height:14px; border-radius:3px; box-shadow:inset 0 0 0 1px var(--line); }
  code { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:.9em; }
  /* save state, search, health */
  .bar { border-top:1px solid var(--line); }
  #pending { font-size:14px; color:var(--mute); } #pending.dirty { color:var(--ink); font-weight:600; }
  button.btn:disabled { opacity:.4; cursor:default; }
  nav button .dirty { color:#c98a00; margin-left:5px; font-size:11px; }
  .badge-n { display:inline-block; min-width:18px; padding:0 6px; border-radius:999px; background:var(--line); color:var(--ink); font-size:12px; margin-left:6px; }
  .subtabs button.on .badge-n { background:var(--bg); color:var(--ink); }
  .tag { display:inline-block; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--mute); border:1px solid var(--line); border-radius:999px; padding:1px 7px; margin-left:8px; vertical-align:1px; }
  input[type=search] { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 12px; min-width:0; }
  .res-h { font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); margin:16px 2px 6px; }
  .hrow { display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line); } .hrow:last-child { border-bottom:0; }
  .hdot { width:12px; height:12px; border-radius:50%; flex:none; background:var(--mute); opacity:.55; } .hdot.ok { background:var(--ok); opacity:1; } .hdot.warn { background:#c98a00; opacity:1; } .hdot.bad { background:var(--bad); opacity:1; }
  .hrow .ht { flex:1; min-width:0; } .hrow .ht b { display:block; } .hrow .ht span { color:var(--mute); font-size:14px; overflow-wrap:anywhere; }
  .bk-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; } .bk-row:last-child { border-bottom:0; } .bk-row span:first-child { flex:1; }
</style>
</head>
<body>
<header>
  <h1>Frame admin</h1>
</header>
<div class="shell">
<nav id="tabs"></nav>
<main>
  <section id="s-chores"></section>
  <section id="s-groceries"></section>
  <section id="s-events"></section>
  <section id="s-people"></section>
  <section id="s-photos"></section>
  <section id="s-connections"></section>
  <section id="s-settings"></section>
  <section id="s-status"></section>
  <div class="bar"><button class="btn" id="save">Save changes</button><span id="pending"></span><span id="msg" class="mute"></span></div>
</main>
</div>
<div id="picker" hidden><div class="pk"><div class="pk-top"><b>Pick an icon</b><button class="x" id="picker-close" title="Close">×</button></div><div id="picker-body"></div><p class="mute">Only icons this frame can draw are listed.</p></div></div>
<script>
'use strict';
var D = null, TAB = 'chores', FEEDS = [], PH = 0;
var TAB_GROUPS = [['Connections', [['connections', 'Calendars & services']]],
  ['Frame content', [['chores', 'Chores'], ['groceries', 'Groceries'], ['events', 'Schedule'], ['people', 'People'], ['photos', 'Photos']]],
  ['Frame', [['settings', 'Settings'], ['status', 'Status']]]];
var TABS = [].concat.apply([], TAB_GROUPS.map(function (g) { return g[1]; }));
var HASH = location.hash.slice(1);
if (TABS.some(function (t) { return t[0] === HASH; })) TAB = HASH;   // /admin#connections opens that page
var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var ROUT = [['morning', 'Morning'], ['after', 'After school / midday'], ['evening', 'Evening']];
var COLORS = ['black', 'purple', 'red', 'blue', 'green', 'yellow', 'pink', 'orange'];
var HEX = { black: '#111111', purple: '#8957E5', red: '#E5252A', blue: '#2D5BFF', green: '#00A36C', yellow: '#FFB000', pink: '#E4007C', orange: '#FF6A13' };
// Emoji this frame can actually draw (tested on the frame itself; newer ones show as empty boxes).
var EMOJI_GROUPS = [["home","Home"],["laundry","Clothes"],["food","Food"],["school","School & play"],["sports","Sports"],["pets","Pets"],["outdoors","Outdoors"],["travel","Travel"],["health","Health"],["misc","Other"]];
var EMOJI = {"home":["🏠","🏡","🛏️","🛁","🚿","🚽","🚪","🔑","🗝️","🔐","🔒","🔓","💡","🕯️","🔌","🔋","🗑️","♻️","🚮","🚰","💧","🌀","🔧","🔨","🛠️","⚙️","🔩","📦","📬","✉️","📮","🛋️"],"laundry":["👕","👖","👗","👚","👔","👟","👞","👒","🧦","🧥","🧢","🎽","👜","🎒","👓","🕶️","💍","👘","🧤","🧣"],"food":["🍽️","🍴","🥄","🔪","🍳","🥘","🍲","🍕","🍔","🌮","🌯","🍝","🍜","🍣","🍱","🥗","🥪","🍞","🥐","🥖","🥞","🧀","🍎","🍌","🍇","🍓","🍊","🍋","🍉","🍑","🍒","🥕","🌽","🥦","🥔","🍅","🥑","🥒","🍆","🥛","☕","🍵","🍷","🍺","🥤","🍪","🍰","🎂","🍫","🍿","🥣","🥫","🥧","🥡","🥢"],"school":["📚","📖","✏️","📝","🖍️","🖊️","📐","📏","📌","🎨","🎹","🎸","🎻","🥁","🎤","🎧","🎬","📷","🎮","🕹️","🎲","🎯","🎁","🎈","🎉","🔬","🔭","🌍"],"sports":["⚽","🏀","🏈","⚾","🎾","🏐","🏉","🏓","🏸","🥊","⛳","🏊","🚴","🚲","⛸️","🎿","🏃","🚶","🧘","🏋️","🤸","🏆","🥇"],"pets":["🐶","🐕","🐩","🐱","🐈","🐠","🐟","🐦","🐹","🐇","🐢","🦎","🐴","🐄","🐑","🐾"],"outdoors":["🌱","🌿","🍀","🌳","🌲","🌻","🌷","🌹","🌵","🍂","🍁","🌾","☀️","⛅","🌧️","☔","❄️","🔥","🌊","🌼","⛺","🏕️"],"travel":["🚗","🚙","🚌","🚕","🚓","🏍️","✈️","🚀","⛽","🛒","🛍️","🚏","🅿️","🏪","🏥","🏫","🏦","⛪","🏢"],"health":["💊","💉","😴","🛌","💪","🧠","❤️","😷","🤒","🌡️"],"misc":["✅","✔️","☑️","⭐","🌟","✨","📞","☎️","📱","💻","📧","📅","⏰","⏳","📆","🎁","💰","💳","🔔","📢","🚩","🏷️","📋","📎","🔍","🗓️","🔗","❗","❓","💯","🆗","🆕"]};
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function opts(list, sel) { return list.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === sel ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); }
function peopleOpts(sel, any) { var l = D.people.map(function (p) { return [p.id, p.name]; }); if (any) l.push(['any', 'Anyone']); return opts(l, sel); }
function msg(t, bad) { var m = $('#msg'); m.textContent = t; m.className = bad ? 'bad' : 'ok'; if (!bad) setTimeout(function () { if (m.textContent === t) m.textContent = ''; }, 3000); }
function api(method, url, body) {
  return fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); });
}
function colorHex(c) { return HEX[c] || c || '#2D5BFF'; }

// ---------------------------------------------------------------- render
function tabs() {
  var dirtyTabs = {}; (D && CN ? dirtyNames() : []).forEach(function (n) { dirtyTabs[SECTIONS[n].tab] = true; });
  $('#tabs').innerHTML = TAB_GROUPS.map(function (g) {
    return '<h6>' + g[0] + '</h6>' + g[1].map(function (t) { return '<button data-t="' + t[0] + '" class="' + (t[0] === TAB ? 'on' : '') + '"><span>' + t[1] + '</span><span class="tr">' + (dirtyTabs[t[0]] ? '<span class="dirty" title="Unsaved changes">\u25CF</span>' : '') + '</span></button>'; }).join('');
  }).join('');
  TABS.forEach(function (t) { $('#s-' + t[0]).classList.toggle('on', t[0] === TAB); });
  barShow();
}
// Open a page: read what is typed on this one first, then draw.
function enterTab(t) {
  collect(); TAB = t; tabs(); window.scrollTo(0, 0);
  if (t === 'photos' && !PHF) loadPhotos();
  if (t === 'status') loadHealth();
}
// ---------------------------------------------------------------- what is saved and what is not
// Two kinds of page. Settings, Photos folders and the Status page save by themselves as you go. Everything else (chores, groceries, schedule,
// people, connections, home layout) is a form: an edit is kept on the page until you press Save, a dot on the tab shows where there are
// unsaved changes, and Save writes every changed form at once so nothing typed on one tab is lost by saving on another.
var BASE = {}, SAVING = false, brTimer = null;
function piece(k) { return function () { var p = connPieces(); return p ? p[k] : null; }; }
// saveKey: sections that are saved by the same request are sent once.
var SECTIONS = {
  chores: { tab: 'chores', label: 'Chores', get: function () { return D.chores; }, save: function () { return api('PUT', '/api/admin/chores', { chores: D.chores }); } },
  groceries: { tab: 'groceries', label: 'Groceries', get: function () { return [D.groceries, D.stores]; }, save: function () { return api('PUT', '/api/groceries', { items: D.groceries, base: D.groceryBase || [] }).then(function () { return api('PUT', '/api/admin/stores', { stores: D.stores }); }); } },
  events: { tab: 'events', label: 'Schedule', get: function () { return D.events; }, save: function () { return api('PUT', '/api/admin/events', { events: D.events }); } },
  people: { tab: 'people', label: 'People', get: function () { return D.people; }, save: function () { return api('PUT', '/api/admin/people', { people: D.people }); } },
  connections: { tab: 'connections', label: 'Calendars & services', get: piece('core'), save: saveConnectionsCall, saveKey: 'conn' },
  photos: { tab: 'photos', label: 'Photos', get: function () { return PHF ? PHF.sel : null; }, save: function () { return savePhotosCall(); } }
};
function sectionJson(n) { try { return JSON.stringify(SECTIONS[n].get()); } catch (e) { return ''; } }

  if (!f || e.target.closest('button')) return;
  var k = selKey(f.dataset.upFolder, f.dataset.upName);
  if (UP.sel[k]) delete UP.sel[k]; else UP.sel[k] = { name: f.dataset.upName, folder: f.dataset.upFolder };
  renderUpload();
});
document.addEventListener('dragstart', function (e) {
  var f = e.target.closest && e.target.closest('figure[data-up-name]');
  if (!f) return;
  var k = selKey(f.dataset.upFolder, f.dataset.upName);
  UP.drag = UP.sel[k] ? selectedItems() : [{ name: f.dataset.upName, folder: f.dataset.upFolder }];   // dragging a selected photo takes the whole selection
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', 'frame-photo'); } catch (x) { /* some browsers need data to start a drag */ }
});
document.addEventListener('dragend', function () { UP.drag = null; Array.prototype.forEach.call(document.querySelectorAll('.over'), function (n) { n.classList.remove('over'); }); });
document.addEventListener('dragover', function (e) {
  var z = e.target.closest && (e.target.closest('#dropzone') || e.target.closest('.up-grp'));
  if (z) { e.preventDefault(); z.classList.add('over'); }
});
document.addEventListener('dragleave', function (e) {
  var z = e.target.closest && (e.target.closest('#dropzone') || e.target.closest('.up-grp'));
  if (z && !z.contains(e.relatedTarget)) z.classList.remove('over');
});
document.addEventListener('drop', function (e) {
  var g = e.target.closest && e.target.closest('.up-grp'), z = e.target.closest && e.target.closest('#dropzone');
  if (!g && !z) return;
  e.preventDefault();
  Array.prototype.forEach.call(document.querySelectorAll('.over'), function (n) { n.classList.remove('over'); });
  if (UP.drag) { var items = UP.drag; UP.drag = null; if (g) movePhotos(items, g.dataset.dropFolder); return; }   // a photo from this page, onto a folder
  if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files, g ? g.dataset.dropFolder : undefined);
});

function savePhotosCall() {
  if (!PHF) return Promise.resolve();
  if (!PHF.sel.length) return Promise.reject(new Error('Tick at least one folder'));
  return api('PUT', '/api/admin/photo-folders', { folders: PHF.sel }).then(function (r) { return loadPhotos().then(function () { return r; }); });
}

function render() { tabs(); renderConnections(); if (CN) CN.domReady = true; renderPhotos(); renderChores(); renderGroceries(); renderEvents(); renderPeople(); renderSettings(); renderStatus(); }

// ---------------------------------------------------------------- read fields back into D
function readCards(root, list, map) {
  root.querySelectorAll('.card[data-i]').forEach(function (card) {
    var o = list[+card.dataset.i]; if (!o) return;
    card.querySelectorAll('[data-f]').forEach(function (el) {
      var k = el.dataset.f, v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.type === 'number') v = v === '' ? 0 : +v;
      o[k] = v;
    });
    if (map) map(card, o);
  });
}
function collect() {
  readCards($('#s-chores'), D.chores, function (card, o) {
    var days = []; card.querySelectorAll('[data-day]').forEach(function (d) { if (d.checked) days.push(+d.dataset.day); });
    o.days = days.length === 7 || !days.length ? null : days;
  });
  readCards($('#s-groceries'), D.groceries);
  $('#s-groceries').querySelectorAll('[data-store]').forEach(function (el) { D.stores[+el.dataset.store].name = el.value; });
  readCards($('#s-events'), D.events, function (card, o) {
    o.people = []; card.querySelectorAll('[data-ep]').forEach(function (c) { if (c.checked) o.people.push(c.dataset.ep); });
  });
  readCards($('#s-people'), D.people);
  collectConnections();
}

// ---------------------------------------------------------------- actions
$('#picker').addEventListener('click', function (e) { if (e.target.id === 'picker') closePicker(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#picker').hidden) closePicker(); });
document.addEventListener('change', function (ev) {
  var ph = ev.target.dataset && ev.target.dataset.ph;
  if (ph !== undefined && PHF) {   // a photo folder was ticked or unticked
    var i = PHF.sel.indexOf(ph);
    if (ev.target.checked && i < 0) PHF.sel.push(ph); else if (!ev.target.checked && i > -1) PHF.sel.splice(i, 1);
    renderPhotos(); return;
  }
  var cc = ev.target.dataset && ev.target.dataset.cc;
  if (cc !== undefined) { collect(); D.people[+cc].color = ev.target.value.toUpperCase(); PCP = null; renderPeople(); }   // a colour picked from the full palette
});

document.addEventListener('click', function (ev) {   // a click anywhere else closes an open colour picker
  if (PCP !== null && !ev.target.closest('.color-pop') && !ev.target.closest('[data-open-color]')) { collect(); PCP = null; renderPeople(); }
});

document.addEventListener('click', function (ev) {
  var t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.t) { enterTab(t.dataset.t); return; }
  if (t.id === 'rescan-photos') { loadPhotos(true); return; }
  if (t.id === 'up-choose') { upInput.click(); return; }
  if (t.id === 'up-newfolder') {
    var nm = prompt('Name for the new folder'); if (!nm || !nm.trim()) return;
    api('POST', '/api/admin/upload-folder', { name: nm }).then(function (r) { UP.folder = r.name; msg('Folder "' + r.name + '" created. New uploads go there.'); return loadUploads(); })
      .catch(function (e) { msg('Not created: ' + e.message, true); });
    return;
  }
  if (t.id === 'up-move') { var sel = selectedItems(); if (sel.length) movePhotos(sel, UP.moveTo); return; }
  if (t.id === 'up-clear') { UP.sel = {}; renderUpload(); return; }
  if (t.dataset.delFolder && !t.dataset.delUp) {
    if (!confirm('Remove the empty folder ' + t.dataset.delFolder + '?')) return;
    api('POST', '/api/admin/upload-folder-delete', { name: t.dataset.delFolder }).then(function () { return loadUploads(); }).catch(function (e) { msg('Not removed: ' + e.message, true); });
    return;
  }
  if (t.dataset.delUp) {
    if (!confirm('Delete ' + t.dataset.delUp + '? The file is removed from the hub and the frame.')) return;
    api('POST', '/api/admin/photo-delete', { name: t.dataset.delUp, folder: t.dataset.delFolderOf || '' }).then(function () { msg('Deleted.'); return loadUploads().then(function () { return loadPhotos(true); }); })
      .catch(function (e) { msg('Not deleted: ' + e.message, true); });
    return;
  }
  if (t.id === 'health-refresh') { HEALTH = null; renderStatus(); loadHealth(); return; }
  if (t.dataset.fix) { goFix(t.dataset.fix); return; }
  if (t.dataset.restore) { restoreBackup(t.dataset.restore, t.dataset.name, t.parentNode.firstChild.textContent); return; }
  collect();
  var d = t.dataset;
  if (d.addChore) { D.chores.push({ id: '', r: 'after', who: d.addChore, title: '', emoji: '✅', stars: 0, days: null }); renderChores(); }
  else if (d.delChore !== undefined) { D.chores.splice(+d.delChore, 1); renderChores(); }
  else if (t.id === 'add-g') { D.groceries.push({ id: '', name: '', cat: 'Pantry', qty: 1, store: D.stores[0].id, done: false, note: '' }); renderGroceries(); }
  else if (d.delG !== undefined) { D.groceries.splice(+d.delG, 1); renderGroceries(); }
  else if (t.id === 'clear-done') { D.groceries = D.groceries.filter(function (g) { return !g.done; }); renderGroceries(); }
  else if (t.id === 'add-e') { var n = new Date(); D.events.push({ id: '', title: '', date: n.toISOString().slice(0, 10), start: '09:00', end: '10:00', allDay: false, people: [], repeat: 'none', loc: '' }); renderEvents(); }
  else if (d.delE !== undefined) { D.events.splice(+d.delE, 1); renderEvents(); }
  else if (t.id === 'add-p') { D.people.push({ id: '', name: '', color: 'blue', kid: false }); renderPeople(); }
  else if (d.delP !== undefined) { if (D.people.length > 1) { D.people.splice(+d.delP, 1); renderPeople(); } }
  else if (d.addCal !== undefined || t.id === 'add-cal') { CN.calendars.push({ key: null, name: '', people: [], urlSet: false, newUrl: '', result: '' }); renderConnections(); }
  else if (d.delCal !== undefined) { CN.calendars.splice(+d.delCal, 1); renderConnections(); }
  else if (d.useLink !== undefined) { CN.calendars.push({ key: d.useLink, name: d.useLink, people: [], urlSet: true, newUrl: '', result: '' }); CN.unusedLinks = CN.unusedLinks.filter(function (k) { return k !== d.useLink; }); renderConnections(); }
  else if (d.testCal !== undefined) testCalendar(+d.testCal);
  else if (d.testAcct !== undefined) testAccount(d.testAcct);
  else if (d.unlinkAcct !== undefined) unlinkAccount(d.unlinkAcct);
  else if (d.ct !== undefined) { CN_TAB = d.ct; renderConnections(); }
  else if (d.pickEmoji !== undefined) openPicker(+d.pickEmoji);
  else if (d.pkGroup !== undefined) { PK.group = d.pkGroup; renderPicker(); }
  else if (d.emoji !== undefined) { D.chores[PK.i].emoji = d.emoji; closePicker(); renderChores(); }
  else if (t.id === 'picker-close') closePicker();
  else if (d.sw !== undefined) { var sp = d.sw.split(':'); D.people[+sp[0]].color = sp[1]; PCP = null; renderPeople(); }
  else if (d.openColor !== undefined) { PCP = (PCP === +d.openColor ? null : +d.openColor); renderPeople(); }
  else if (d.closeColor !== undefined) { PCP = null; renderPeople(); }
  else if (d.hafind !== undefined) findStreamHA(d.hafind, t);
  else if (t.id === 'test-px') testProxmenux();
  else if (t.id === 'test-ha') testHA();
  else if (t.id === 'ha-ring') ringHA();
  else if (t.id === 'regen-agents') regenAgents();
  else if (d.st !== undefined) { collect(); SET_TAB = d.st; renderSettings(); }
  else if (d.tuneResetPage !== undefined) {
    if (!confirm('Reset every setting on this page to its default?')) return;
    (D.tuneSchema || []).filter(function (r) { return r.tab === 'settings' && r.sub === d.tuneResetPage; }).forEach(function (r) { setTune(r.key, r.def, true); });
  }
  else if (d.tuneReset !== undefined) { var tr = tuneSchemaRow(d.tuneReset); if (tr) setTune(d.tuneReset, tr.def, true); }
  else if (t.id === 'save') saveAll();
});
document.addEventListener('input', function (e) {
  var t = e.target; if (!t.dataset || t.dataset.tune === undefined) return;
  var r = tuneSchemaRow(t.dataset.tune);
  if (r && r.type === 'num' && t.type === 'number' && (t.value === '' || +t.value < r.min || +t.value > r.max)) return;   // still typing
  setTune(t.dataset.tune, t.value);
});
document.addEventListener('change', function (e) { var t = e.target; if (t.dataset && t.dataset.tune !== undefined && t.type === 'number') setTune(t.dataset.tune, t.value, true); });

// Save every form that has unsaved changes. One that fails does not undo the others, and nothing is reloaded over what you typed.
function saveAll() {
  if (SAVING) return;
  var names = dirtyNames();
  if (!names.length) { msg('Nothing to save.'); return; }
  SAVING = true; barRefresh(); msg('Saving…');
  var done = [], failed = [], extra = '', pw = false, keys = [], byKey = {};
  names.forEach(function (n) { var k = SECTIONS[n].saveKey || n; if (!byKey[k]) { byKey[k] = []; keys.push(k); } byKey[k].push(n); });
  keys.reduce(function (p, k) {
    var n = byKey[k][0];
    return p.then(function () {
      return SECTIONS[n].save().then(function (r) {
        done = done.concat(byKey[k]);
        if (r && r.passwordChanged) pw = true;
        if (k === 'photos' && r && r.showing != null) extra = ' ' + r.showing + ' photos will show on the frame.' + (r.skipped && r.skipped.length ? ' Ignored folders that no longer exist: ' + r.skipped.join(', ') + '.' : '');
      }, function (e) { failed.push(labelsOf(byKey[k]) + ': ' + e.message); });
    });
  }, Promise.resolve()).then(function () {
    SAVING = false;
    if (pw) { msg('Saved. Your password changed; reloading so you can sign in again…'); setTimeout(function () { location.reload(); }, 1500); return; }
    if (failed.length) { rebase(done); msg((done.length ? 'Saved ' + labelsOf(done) + '. ' : '') + 'Not saved — ' + failed.join('; '), true); barRefresh(); return; }
    rebase(done);   // what was just written is now what the hub has, so the reload below does not treat it as unsaved
    return load().then(function () { msg('Saved ' + labelsOf(done) + '.' + extra + ' The frame picks it up within about 20 seconds.'); });
  });
}

// Fetch everything again. Sections with unsaved edits keep what is on the page; the rest are refreshed from the hub.
function load() {
  var keep = {}; dirtyNames().forEach(function (n) { keep[n] = true; });
  var oldD = D, oldCN = keep.connections ? CN : null;
  return Promise.all([api('GET', '/api/admin/data'), api('GET', '/api/state'), api('GET', '/api/admin/connections')]).then(function (r) {
    var nd = r[0]; nd.groceryBase = (nd.groceries || []).map(function (g) { return g.id; });
    if (oldD) {
      if (keep.chores) nd.chores = oldD.chores;
      if (keep.groceries) { nd.groceries = oldD.groceries; nd.stores = oldD.stores; nd.groceryBase = oldD.groceryBase; }
      if (keep.events) nd.events = oldD.events;
      if (keep.people) nd.people = oldD.people;
    }
    D = nd; FEEDS = r[1].feeds || []; PH = (r[1].photos || []).length;
    var shown = CN && CN.shownToken; cnInit(r[2]); if (shown) CN.shownToken = shown;
    if (oldCN) {   // typed values stay; things only the hub knows (accounts, password state) are refreshed
      var fresh = CN; CN = oldCN;
      ['accounts', 'adminPasswordSet', 'agentsTokenSet', 'files', 'photosDir', 'unusedLinks'].forEach(function (k) { CN[k] = fresh[k]; });
    }
    render();
    rebase(Object.keys(SECTIONS).filter(function (n) { return !keep[n] && n !== 'photos'; }));
    barRefresh();
  });
}
load().then(function () { if (TAB === 'photos') loadPhotos(); if (TAB === 'status') loadHealth(); }).catch(function (e) { msg('Could not load: ' + e.message, true); });
</script>
